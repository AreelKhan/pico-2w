[project]
name = "hello-world"
version = "0.1.0"
description = "Learning Rasberry Pi Pico 2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "micropython-rp2-stubs==1.27.0.post1",
    "mpremote>=1.27.0",
    "opencv-python>=4.12.0.88",
    "pip>=25.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.7",
]

[tool.ty.src]
exclude = ["src/clicker/**"]
