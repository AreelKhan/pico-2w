[project]
name = "hello-world"
version = "0.1.0"
description = "Learning Rasberry Pi Pico 2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "micropython-rp2-stubs==1.27.0.post1",
    "mpremote>=1.27.0",
    "opencv-python>=4.12.0.88",
    "pyserial>=3.5",
    "pip>=25.3",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
robot = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.7",
]

[tool.ty.src]
exclude = ["src/clicker/**"]
